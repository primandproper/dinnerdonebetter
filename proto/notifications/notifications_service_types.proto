syntax = "proto3";

package notifications;

import "common.proto";
import "notifications/notifications_messages.proto";
import "primandproper/platform/filtering/v1/filtering.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/notifications";

message GetUserNotificationRequest {
  string user_notification_id = 1;
}

message GetUserNotificationResponse {
  common.ResponseDetails response_details = 1;
  UserNotification result = 2;
}

message GetUserNotificationsRequest {
  primandproper.platform.filtering.v1.QueryFilter filter = 1;
}

message GetUserNotificationsResponse {
  common.ResponseDetails response_details = 1;
  primandproper.platform.filtering.v1.Pagination pagination = 2;
  repeated UserNotification results = 3;
}

message UpdateUserNotificationRequest {
  string user_notification_id = 1;
  UserNotificationUpdateRequestInput input = 2;
}

message UpdateUserNotificationResponse {
  common.ResponseDetails response_details = 1;
  UserNotification updated = 2;
}

message UserNotificationCreationRequestInput {
  string content = 1;
  UserNotificationStatus status = 2;
  string belongs_to_user = 3;
}

message UserNotificationUpdateRequestInput {
  optional UserNotificationStatus status = 1;
}

message RegisterDeviceTokenRequest {
  UserDeviceTokenCreationRequestInput input = 1;
}

message RegisterDeviceTokenResponse {
  common.ResponseDetails response_details = 1;
  UserDeviceToken created = 2;
}

message GetUserDeviceTokenRequest {
  string user_device_token_id = 1;
}

message GetUserDeviceTokenResponse {
  common.ResponseDetails response_details = 1;
  UserDeviceToken result = 2;
}

message GetUserDeviceTokensRequest {
  primandproper.platform.filtering.v1.QueryFilter filter = 1;
  optional string platform_filter = 2;
}

message GetUserDeviceTokensResponse {
  common.ResponseDetails response_details = 1;
  primandproper.platform.filtering.v1.Pagination pagination = 2;
  repeated UserDeviceToken results = 3;
}

message ArchiveUserDeviceTokenRequest {
  string user_device_token_id = 1;
}

message ArchiveUserDeviceTokenResponse {
  common.ResponseDetails response_details = 1;
}

message UserDeviceTokenCreationRequestInput {
  string device_token = 1;
  string platform = 2;
}
