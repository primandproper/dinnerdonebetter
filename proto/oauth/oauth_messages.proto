syntax = "proto3";

package oauth;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/oauth";

message OAuth2Client {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp archived_at = 2;
  string name = 3;
  string description = 4;
  string client_id = 5;
  string id = 6;
  string client_secret = 7;
  // The exact addresses this client may receive an authorization code at, compared byte for
  // byte by the authorization server. A client registers what it will actually send as
  // redirect_uri, ports and trailing slashes included.
  repeated string redirect_uris = 8;
}
