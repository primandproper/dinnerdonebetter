syntax = "proto3";

package oauth;

import "common.proto";
import "oauth/oauth_messages.proto";
import "primandproper/platform/filtering/v1/filtering.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/oauth";

message CreateOAuth2ClientRequest {
  OAuth2ClientCreationRequestInput input = 1;
}

message CreateOAuth2ClientResponse {
  common.ResponseDetails response_details = 1;
  OAuth2Client created = 2;
}

message ArchiveOAuth2ClientRequest {
  string oauth2_client_id = 1;
}

message ArchiveOAuth2ClientResponse {
  common.ResponseDetails response_details = 1;
}

message GetOAuth2ClientRequest {
  string oauth2_client_id = 1;
}

message GetOAuth2ClientResponse {
  common.ResponseDetails response_details = 1;
  OAuth2Client result = 2;
}

message GetOAuth2ClientsRequest {
  primandproper.platform.filtering.v1.QueryFilter filter = 1;
}

message GetOAuth2ClientsResponse {
  common.ResponseDetails response_details = 1;
  primandproper.platform.filtering.v1.Pagination pagination = 2;
  repeated OAuth2Client results = 3;
}

message OAuth2ClientCreationRequestInput {
  string name = 1;
  string description = 2;
  // At least one is required. The authorization server matches redirect_uri byte for byte
  // against this list, so a client registered without one can authenticate at the token
  // endpoint and still never complete an authorization request.
  repeated string redirect_uris = 3;
}

message OAuth2ClientCreationResponse {
  string client_id = 1;
  string client_secret = 2;
  string name = 3;
  string description = 4;
  string id = 5;
  repeated string redirect_uris = 6;
}
