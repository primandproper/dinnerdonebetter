syntax = "proto3";

package webhooks;

import "common.proto";
import "primandproper/platform/filtering/v1/filtering.proto";
import "webhooks/webhooks_messages.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/webhooks";

message WebhookCreationRequestInput {
  string name = 1;
  WebhookContentType content_type = 2;
  string url = 3;
  WebhookMethod method = 4;

  reserved 5;
  reserved "events";

  // event_types are the catalog event types this webhook subscribes to.
  //
  // Field 5 previously carried WebhookTriggerEventCreationRequestInput, which let a caller
  // define new catalog rows inline. That is gone: the catalog is generated from the events the
  // application actually publishes, so an event type a caller invents is one nothing will ever
  // emit. Subscribing to an unknown type is now rejected rather than silently stored.
  repeated string event_types = 6;
}

message WebhookTriggerConfigCreationRequestInput {
  string belongs_to_webhook = 1;

  reserved 2;
  reserved "trigger_event_id";

  string event_type = 3;
}

message CreateWebhookRequest {
  WebhookCreationRequestInput input = 1;
}

message CreateWebhookResponse {
  common.ResponseDetails response_details = 1;
  Webhook created = 2;

  // secret is the hex-encoded HMAC signing key, returned exactly once.
  //
  // It is on the creation response and on no read message, so there is no request an attacker
  // with read access can make that yields it. A caller who loses it calls RotateWebhookSecret.
  //
  // Deliveries carry X-Platform-Signature: v1,t=<unix>,s=<hex>, over "v1.<t>.<body>". The
  // timestamp is inside the signed material, which is what makes a captured delivery expire —
  // verify it before spending an HMAC. platform-go's webhooks.Verify is the reference
  // implementation.
  string secret = 3;
}

message AddWebhookTriggerConfigRequest {
  string webhook_id = 1;
  WebhookTriggerConfigCreationRequestInput input = 2;
}

message AddWebhookTriggerConfigResponse {
  common.ResponseDetails response_details = 1;
  WebhookTriggerConfig created = 2;
}

message ArchiveWebhookRequest {
  string webhook_id = 1;
}

message ArchiveWebhookResponse {
  common.ResponseDetails response_details = 1;
}

message ArchiveWebhookTriggerConfigRequest {
  string webhook_id = 1;
  string webhook_trigger_config_id = 2;
}

message ArchiveWebhookTriggerConfigResponse {
  common.ResponseDetails response_details = 1;
}

message GetWebhookRequest {
  string webhook_id = 1;
}

message GetWebhookResponse {
  common.ResponseDetails response_details = 1;
  Webhook result = 2;
}

message GetWebhooksRequest {
  primandproper.platform.filtering.v1.QueryFilter filter = 1;
}

message GetWebhooksResponse {
  common.ResponseDetails response_details = 1;
  primandproper.platform.filtering.v1.Pagination pagination = 2;
  repeated Webhook results = 3;
}

// RotateWebhookSecret mints a new signing secret for a webhook.
//
// Deliveries are signed under both the new key and the outgoing one until this is called again,
// so a subscriber accepts either signature while it switches over. Rotating twice retires the
// original key.
message RotateWebhookSecretRequest {
  string webhook_id = 1;
}

message RotateWebhookSecretResponse {
  common.ResponseDetails response_details = 1;
  // secret is the new hex-encoded HMAC signing key, returned exactly once.
  string secret = 2;
}

message GetWebhookEventTypesRequest {
}

message GetWebhookEventTypesResponse {
  common.ResponseDetails response_details = 1;
  repeated WebhookEventType results = 2;
}
