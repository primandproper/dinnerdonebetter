syntax = "proto3";

package auth;

import "auth/auth_service_types.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/auth";

// AuthService is what is left of this application's own sign-in surface: the two doors
// platform's SignInService does not have yet. Everything else a client signs in, proves a
// credential or manages a login through is platform's — SignInService, PasswordResetService
// and PasskeysService.
service AuthService {
  // RegisterUser is a sign-up, until platform's SignInService has an open sign-up door
  // (platform-go#1068).
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  // ExchangeToken moves a login into another of its user's accounts, until platform's
  // SignInService can (platform-go#1069).
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);
}
