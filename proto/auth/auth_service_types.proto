syntax = "proto3";

package auth;

import "auth/auth_messages.proto";
import "common.proto";
import "filtering.proto";
import "google/protobuf/timestamp.proto";
import "identity/identity_messages.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/auth";

message LoginForTokenRequest {
  UserLoginInput input = 1;
}

message LoginForTokenResponse {
  common.ResponseDetails response_details = 1;
  TokenResponse result = 2;
}

message AdminLoginForTokenRequest {
  UserLoginInput input = 1;
}

message AdminLoginForTokenResponse {
  common.ResponseDetails response_details = 1;
  TokenResponse result = 2;
}

message ExchangeTokenRequest {
  string refresh_token = 1;
  string desired_account_id = 2;
}

message ExchangeTokenResponse {
  common.ResponseDetails response_details = 1;
  string user_id = 2;
  string account_id = 3;
  string access_token = 4;
  string refresh_token = 5;
  google.protobuf.Timestamp expires_utc = 6;
}

message GetActiveAccountRequest {
}

message GetActiveAccountResponse {
  common.ResponseDetails response_details = 1;
  identity.Account result = 2;
}

message GetAuthStatusRequest {
}

message GetAuthStatusResponse {
  common.ResponseDetails response_details = 1;
  string user_id = 2;
  string account_status = 3;
  string account_status_explanation = 4;
  string active_account = 5;
  bool requires_password_change = 6;
}

message RedeemPasswordResetTokenRequest {
  string token = 1;
  string new_password = 2;
}

message RedeemPasswordResetTokenResponse {
  common.ResponseDetails response_details = 1;
}

message RefreshTOTPSecretRequest {
  string current_password = 1;
  string totp_token = 2;
}

message RefreshTOTPSecretResponse {
  common.ResponseDetails response_details = 1;
  TOTPSecretRefreshResponse result = 2;
}

message RequestEmailVerificationEmailRequest {
  string email_address = 1;
}

message RequestEmailVerificationEmailResponse {
  common.ResponseDetails response_details = 1;
  bool submitted = 2;
}

message RequestPasswordResetTokenRequest {
  string email_address = 1;
}

message RequestPasswordResetTokenResponse {
  common.ResponseDetails response_details = 1;
  bool accepted = 2;
}

message RequestUsernameReminderRequest {
  string email_address = 1;
}

message RequestUsernameReminderResponse {
  common.ResponseDetails response_details = 1;
  bool submitted = 2;
}

message UpdatePasswordRequest {
  string new_password = 1;
  string current_password = 2;
  string totp_token = 3;
}

message UpdatePasswordResponse {
  common.ResponseDetails response_details = 1;
}

message VerifyEmailAddressRequest {
  string token = 1;
}

message VerifyEmailAddressResponse {
  common.ResponseDetails response_details = 1;
  bool verified = 2;
}

message VerifyTOTPSecretRequest {
  string totp_token = 1;
  string user_id = 2;
}

message VerifyTOTPSecretResponse {
  common.ResponseDetails response_details = 1;
  bool accepted = 2;
}

message EmailAddressVerificationRequest {
  string token = 1;
}

message EmailAddressVerificationResponse {
  common.ResponseDetails response_details = 1;
}

message PasswordResetResponse {
  common.ResponseDetails response_details = 1;
  bool successful = 2;
}

message PasswordResetTokenCreationRequestInput {
  string email_address = 1;
}

message PasswordResetTokenRedemptionRequestInput {
  string token = 1;
  string new_password = 2;
}

message TOTPSecretRefreshResponse {
  string two_factor_qr_code = 1;
  string two_factor_secret = 2;
}

message TOTPSecretVerificationResponse {
  common.ResponseDetails response_details = 1;
  bool accepted = 2;
}

message TokenResponse {
  string user_id = 1;
  string account_id = 2;
  string access_token = 3;
  string refresh_token = 4;
  google.protobuf.Timestamp expires_utc = 5;
}

message UserPermissionsRequestInput {
  repeated string permissions = 1;
}

message UserPermissionsResponse {
  common.ResponseDetails response_details = 1;
  map<string, bool> permissions = 2;
}

message UsernameReminderRequestInput {
  string email_address = 1;
}

message EvaluateBooleanFeatureFlagRequest {
  string feature_flag = 1;
}

message EvaluateBooleanFeatureFlagResponse {
  common.ResponseDetails response_details = 1;
  bool enabled = 2;
}

message EvaluateInt64FeatureFlagRequest {
  string feature_flag = 1;
}

message EvaluateInt64FeatureFlagResponse {
  common.ResponseDetails response_details = 1;
  int64 value = 2;
}

message EvaluateStringFeatureFlagRequest {
  string feature_flag = 1;
}

message EvaluateStringFeatureFlagResponse {
  common.ResponseDetails response_details = 1;
  string value = 2;
}

message BeginPasskeyRegistrationRequest {
}

message BeginPasskeyRegistrationResponse {
  common.ResponseDetails response_details = 1;
  bytes public_key_credential_creation_options = 2;
  string challenge = 3;
}

message FinishPasskeyRegistrationRequest {
  bytes attestation_response = 1;
  string challenge = 2;
}

message FinishPasskeyRegistrationResponse {
  common.ResponseDetails response_details = 1;
}

message BeginPasskeyAuthenticationRequest {
  string username = 1;
}

message BeginPasskeyAuthenticationResponse {
  common.ResponseDetails response_details = 1;
  bytes public_key_credential_request_options = 2;
  string challenge = 3;
}

message FinishPasskeyAuthenticationRequest {
  bytes assertion_response = 1;
  string challenge = 2;
  string username = 3;
}

message GetSelfRequest {
}

message GetSelfResponse {
  common.ResponseDetails response_details = 1;
  identity.User result = 2;
}

message ListPasskeysRequest {
}

message ListPasskeysResponse {
  common.ResponseDetails response_details = 1;
  repeated PasskeyCredential results = 2;
}

message PasskeyCredential {
  string id = 1;
  string friendly_name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

message ArchivePasskeyRequest {
  string credential_id = 1;
}

message ArchivePasskeyResponse {
  common.ResponseDetails response_details = 1;
}

message ListActiveSessionsRequest {
  filtering.QueryFilter filter = 1;
}

message ListActiveSessionsResponse {
  common.ResponseDetails response_details = 1;
  filtering.Pagination pagination = 2;
  repeated UserSession sessions = 3;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {
  common.ResponseDetails response_details = 1;
}

message RevokeAllOtherSessionsRequest {
}

message RevokeAllOtherSessionsResponse {
  common.ResponseDetails response_details = 1;
}

message RevokeCurrentSessionRequest {
}

message RevokeCurrentSessionResponse {
  common.ResponseDetails response_details = 1;
}

message AdminListSessionsForUserRequest {
  string user_id = 1;
  filtering.QueryFilter filter = 2;
}

message AdminRevokeUserSessionRequest {
  string user_id = 1;
  string session_id = 2;
}

message AdminRevokeAllUserSessionsRequest {
  string user_id = 1;
}
