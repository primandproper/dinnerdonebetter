syntax = "proto3";

package comments;

import "comments/comments_messages.proto";
import "common.proto";
import "primandproper/platform/filtering/v1/filtering.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/comments";

message CreateCommentRequest {
  CommentCreationRequestInput input = 1;
}

message CreateCommentResponse {
  common.ResponseDetails response_details = 1;
  Comment comment = 2;
}

message ArchiveCommentRequest {
  string comment_id = 1;
}

message ArchiveCommentResponse {
  common.ResponseDetails response_details = 1;
}

// GetRootCommentsRequest reads the top level of one target's discussion.
message GetRootCommentsRequest {
  CommentTarget target = 1;
  primandproper.platform.filtering.v1.QueryFilter filter = 2;
}

message GetRootCommentsResponse {
  common.ResponseDetails response_details = 1;
  repeated Comment data = 2;
  // pagination's filtered count is of the target's roots, not of this page — it
  // is the count a client renders beside the discussion.
  primandproper.platform.filtering.v1.Pagination pagination = 3;
}

// GetCommentRepliesRequest reads one root comment's replies. The target is named
// as well as the parent because a reply carries both and the read keys on both.
message GetCommentRepliesRequest {
  CommentTarget target = 1;
  string parent_id = 2;
  primandproper.platform.filtering.v1.QueryFilter filter = 3;
}

message GetCommentRepliesResponse {
  common.ResponseDetails response_details = 1;
  repeated Comment data = 2;
  primandproper.platform.filtering.v1.Pagination pagination = 3;
}

message UpdateCommentRequest {
  string comment_id = 1;
  CommentUpdateRequestInput input = 2;
}

message UpdateCommentResponse {
  common.ResponseDetails response_details = 1;
  Comment comment = 2;
}
