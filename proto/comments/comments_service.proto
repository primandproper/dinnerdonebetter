syntax = "proto3";

package comments;

import "comments/comments_service_types.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/comments";

service CommentsService {
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc ArchiveComment(ArchiveCommentRequest) returns (ArchiveCommentResponse);
  rpc GetRootComments(GetRootCommentsRequest) returns (GetRootCommentsResponse);
  rpc GetCommentReplies(GetCommentRepliesRequest) returns (GetCommentRepliesResponse);
  rpc UpdateComment(UpdateCommentRequest) returns (UpdateCommentResponse);
}
