syntax = "proto3";

package waitlists;

import "common.proto";
import "google/protobuf/timestamp.proto";
import "primandproper/platform/filtering/v1/filtering.proto";
import "waitlists/waitlists_messages.proto";

option go_package = "github.com/primandproper/dinnerdonebetter/backend/internal/grpc/generated/services/waitlists";

message WaitlistCreationRequestInput {
  string name = 1;
  string description = 2;
  google.protobuf.Timestamp closes_at = 3;
}

message WaitlistUpdateRequestInput {
  optional string name = 1;
  optional string description = 2;
  optional google.protobuf.Timestamp closes_at = 3;
}

// WaitlistSignupCreationRequestInput is everything a caller decides about their
// own signup, which is the note and nothing else. The address the list writes to
// and the user the signup belongs to both come from the session: a signup that
// could name its own contact is one anybody could make on anybody's behalf.
message WaitlistSignupCreationRequestInput {
  string notes = 1;
}

message WaitlistSignupUpdateRequestInput {
  optional string notes = 1;
}

message CreateWaitlistRequest {
  WaitlistCreationRequestInput input = 1;
}

message CreateWaitlistResponse {
  common.ResponseDetails response_details = 1;
  Waitlist created = 2;
}

message GetWaitlistRequest {
  string waitlist_id = 1;
}

message GetWaitlistResponse {
  common.ResponseDetails response_details = 1;
  Waitlist result = 2;
}

message GetWaitlistsRequest {
  primandproper.platform.filtering.v1.QueryFilter filter = 1;
}

message GetWaitlistsResponse {
  common.ResponseDetails response_details = 1;
  primandproper.platform.filtering.v1.Pagination pagination = 2;
  repeated Waitlist results = 3;
}

message GetOpenWaitlistsRequest {
  primandproper.platform.filtering.v1.QueryFilter filter = 1;
}

message GetOpenWaitlistsResponse {
  common.ResponseDetails response_details = 1;
  primandproper.platform.filtering.v1.Pagination pagination = 2;
  repeated Waitlist results = 3;
}

message UpdateWaitlistRequest {
  string waitlist_id = 1;
  WaitlistUpdateRequestInput input = 2;
}

message UpdateWaitlistResponse {
  common.ResponseDetails response_details = 1;
  Waitlist updated = 2;
}

message ArchiveWaitlistRequest {
  string waitlist_id = 1;
}

message ArchiveWaitlistResponse {
  common.ResponseDetails response_details = 1;
}

message WaitlistIsOpenRequest {
  string waitlist_id = 1;
}

message WaitlistIsOpenResponse {
  common.ResponseDetails response_details = 1;
  bool is_open = 2;
}

message JoinWaitlistRequest {
  string waitlist_id = 1;
  WaitlistSignupCreationRequestInput input = 2;
}

message JoinWaitlistResponse {
  common.ResponseDetails response_details = 1;
  WaitlistSignup created = 2;
}

message GetWaitlistSignupRequest {
  string waitlist_id = 1;
  string waitlist_signup_id = 2;
}

message GetWaitlistSignupResponse {
  common.ResponseDetails response_details = 1;
  WaitlistSignup result = 2;
}

message GetWaitlistSignupsForWaitlistRequest {
  string waitlist_id = 1;
  primandproper.platform.filtering.v1.QueryFilter filter = 2;
}

message GetWaitlistSignupsForWaitlistResponse {
  common.ResponseDetails response_details = 1;
  primandproper.platform.filtering.v1.Pagination pagination = 2;
  repeated WaitlistSignup results = 3;
}

message UpdateWaitlistSignupRequest {
  string waitlist_id = 1;
  string waitlist_signup_id = 2;
  WaitlistSignupUpdateRequestInput input = 3;
}

message UpdateWaitlistSignupResponse {
  common.ResponseDetails response_details = 1;
  WaitlistSignup updated = 2;
}

message InviteWaitlistSignupRequest {
  string waitlist_id = 1;
  string waitlist_signup_id = 2;
}

message InviteWaitlistSignupResponse {
  common.ResponseDetails response_details = 1;
  WaitlistSignup updated = 2;
}

message ConvertWaitlistSignupRequest {
  string waitlist_id = 1;
  string waitlist_signup_id = 2;
}

message ConvertWaitlistSignupResponse {
  common.ResponseDetails response_details = 1;
  WaitlistSignup updated = 2;
}

message WithdrawFromWaitlistRequest {
  string waitlist_id = 1;
  string waitlist_signup_id = 2;
}

// WithdrawFromWaitlistResponse carries the withdrawn signup: its contact and
// notes are blank and its status says why, which is what lets an unsubscribe
// page say "you are off this list" rather than nothing at all.
message WithdrawFromWaitlistResponse {
  common.ResponseDetails response_details = 1;
  WaitlistSignup updated = 2;
}

message ArchiveWaitlistSignupRequest {
  string waitlist_id = 1;
  string waitlist_signup_id = 2;
}

message ArchiveWaitlistSignupResponse {
  common.ResponseDetails response_details = 1;
}
