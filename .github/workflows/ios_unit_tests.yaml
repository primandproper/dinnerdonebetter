---
on:
  pull_request:
    paths:
      - ios/**/*.swift
      - ios/**/*.xcodeproj
      - ios/**/*.xcworkspace
      - ios/Makefile

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: ios unit tests
jobs:
  ios_unit_tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create Secrets.xcconfig
        working-directory: ios
        run: cp Secrets.xcconfig.example Secrets.xcconfig

      - name: Select an available iPhone simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j \
            | jq -r 'first(.devices[][] | select(.name | startswith("iPhone")) | "platform=iOS Simulator,id=" + .udid)')
          if [ -z "$DEST" ] || [ "$DEST" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using destination: $DEST"
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: ios
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
        run: make unit-test
