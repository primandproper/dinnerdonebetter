---
# The generated gRPC code is committed, so the job here is proving it is what the pinned
# toolchain produces from the committed .proto files. Catches a hand-edited generated
# file, a pin bumped without regenerating, and a regeneration nobody committed.
on:
  pull_request:
    paths:
      - proto/**
      - Makefile
      - mise.toml
      - scripts/assert_tool_version*.sh
      - scripts/protoc-plugins/**
      - backend/go.mod
      - backend/internal/grpc/generated/**
      - frontend/package-lock.json
      - frontend/packages/api-client/src/**
      - ios/ios/Generated/**
      - .github/workflows/proto_generated_files.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: proto generated files
jobs:
  toolchain_assertions:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Test the version assertion
        run: make test_scripts

  swift:
    timeout-minutes: 30
    # macOS for the Swift toolchain the pinned plugins are built with.
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The platform .proto files are read out of the Go module cache.
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      # Keep in step with PROTOC_VERSION in the Makefile, which asserts it.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '33.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate Swift
        run: make proto_swift

      # Only the generated directory: proto_swift also runs swift-format over the app,
      # which is not what this job is checking.
      - name: Check for changes
        run: git diff --exit-code -- ios/ios/Generated

  go_and_typescript:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Keep in step with PROTOC_VERSION in the Makefile, which asserts it.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '33.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate Go and TypeScript
        run: make proto_golang proto_typescript

      - name: Check for changes
        run: git diff --exit-code -- backend/internal/grpc/generated frontend/packages/api-client/src
