---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Interval-shaped periodic work runs inside one long-lived process; see scheduler_deployment.yaml.
  - scheduler_deployment.yaml
  # Calendar-shaped work stays a CronJob: jobs.Scheduler takes intervals, not cron expressions,
  # and an interval that starts whenever the pod last restarted is not a wall-clock time.
  - db_cleaner_cronjob.yaml
  - email_deliverability_test_cronjob.yaml
