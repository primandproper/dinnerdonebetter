---
# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/resource/
resources:
  - namespace.yaml
  - ../../../kustomize/components/api_server
  - ../../../kustomize/components/workers
  # Uncomment to enable MCP server deployment
  # - ../../../kustomize/components/mcp_server

# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/
patches:
  # API Server - override hostnames for K8s and use local images
  - path: patches/deployment-k8s-hostnames.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment
  - path: patches/deployment-local-image-pull.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment

  # Scheduler Deployment - the interval-shaped jobs that were one CronJob each
  - path: patches/deployment-k8s-hostnames.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-scheduler-deployment
  - path: patches/deployment-local-image-pull.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-scheduler-deployment

  # DB Cleaner CronJob
  - path: patches/cronjob-k8s-hostnames.yaml
    target:
      kind: CronJob
      name: dinner-done-better-job-db-cleaner
  - path: patches/cronjob-local-image-pull.yaml
    target:
      kind: CronJob
      name: dinner-done-better-job-db-cleaner

  # Email Deliverability Test CronJob
  - path: patches/cronjob-k8s-hostnames.yaml
    target:
      kind: CronJob
      name: dinner-done-better-job-email-deliverability-test
  - path: patches/cronjob-local-image-pull.yaml
    target:
      kind: CronJob
      name: dinner-done-better-job-email-deliverability-test

labels:
  - pairs:
      app.kubernetes.io/name: dinner-done-better-backend
      deployed_by: skaffold

# The config files are the ones docker-compose mounts, read straight out of
# ../config_files/ rather than copied here — the JSON is identical either way, because the
# K8s-specific hostnames are injected via the env var patches above and never rendered
# into the file. Reaching outside the kustomization root needs
# `--load-restrictor LoadRestrictionsNone`, which skaffold.yaml passes; this kustomization
# is already not relocatable, by way of the ../../../kustomize/components resources above.
configMapGenerator:
  - name: dinner-done-better-service-api-config
    namespace: localdev
    files:
      - config.json=../config_files/api_service_config.json

  - name: dinner-done-better-job-db-cleaner-config
    namespace: localdev
    files:
      - config.json=../config_files/job_db_cleaner_config.json

  - name: dinner-done-better-job-email-deliverability-test-config
    namespace: localdev
    files:
      - config.json=../config_files/job_email_deliverability_test_config.json

  - name: dinner-done-better-scheduler-config
    namespace: localdev
    files:
      - config.json=../config_files/scheduler_config.json

  # Uncomment to enable MCP server deployment
  # - name: dinner-done-better-mcp-server-config
  #   namespace: localdev
  #   files:
  #     - config.json=../config_files/mcp_server_config.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    generated_by: skaffold
    deployed_by: skaffold
  annotations:
    generated_by: skaffold
    deployed_by: skaffold
