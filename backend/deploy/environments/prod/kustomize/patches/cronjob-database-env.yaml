# Shared database environment variables for CronJobs (host + encryption keys).
# Per-service password patches are applied separately.
- op: add
  path: "/spec/jobTemplate/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_DATABASE_READ_CONNECTION_HOST
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: DATABASE_HOST
- op: add
  path: "/spec/jobTemplate/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_DATABASE_WRITE_CONNECTION_HOST
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: DATABASE_HOST
