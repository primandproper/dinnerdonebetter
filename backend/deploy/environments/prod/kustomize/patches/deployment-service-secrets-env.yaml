# Service-specific secrets for Deployments (Algolia, SendGrid, PostHog, JWT)
# Applied via JSON patch to inject service secrets
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_ANALYTICS_PROVIDER
    value: posthog
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_ANALYTICS_POSTHOG_API_KEY
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: POSTHOG_API_KEY
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_SEARCH_ALGOLIA_API_KEY
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: ALGOLIA_API_KEY
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_SEARCH_ALGOLIA_APP_ID
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: ALGOLIA_APPLICATION_ID
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_EMAIL_RESEND_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: RESEND_API_KEY
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_FEATURE_FLAGS_POSTHOG_PROJECT_API_KEY
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: POSTHOG_API_KEY
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_FEATURE_FLAGS_POSTHOG_PERSONAL_API_KEY
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: POSTHOG_PERSONAL_API_KEY
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DINNER_DONE_BETTER_SERVICE_AUTH_TOKENS_SIGNING_KEY
    valueFrom:
      secretKeyRef:
        name: api-service-config
        key: JWT_SIGNING_KEY
