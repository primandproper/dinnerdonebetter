---
# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/resource/
resources:
  - ../../../kustomize/components/api_server
  - ../../../kustomize/components/workers
  - ../../../kustomize/components/async_functions
  - ../../../kustomize/components/mcp_server

# Every workload runs the same image and differs only in the subcommand its manifest passes,
# so prod cannot end up running the API at one commit and the scheduler at another.
images:
  - name: dinner-done-better-backend
    newName: us-central1-docker.pkg.dev/dinner-done-better-prod/containers/dinner-done-better-backend
    newTag: latest

# See: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/
patches:
  ### API Server - needs database, pubsub, service secrets (from Terraform api-service-config), workload identity
  - path: patches/deployment-workload-identity.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment
  - path: patches/deployment-database-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment
  - path: patches/deployment-database-password-api-server.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment
  - path: patches/deployment-pubsub-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment
  - path: patches/deployment-service-secrets-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment
  - path: patches/deployment-tracing-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment
  - path: patches/deployment-disclosure-artifact-key-api.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment

  ### Pyroscope (Grafana Cloud) - API server only; uncomment to enable for other workloads
  - path: patches/deployment-pyroscope-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-service-api-deployment
  # - path: patches/deployment-pyroscope-env.yaml
  #   target:
  #     version: v1
  #     kind: Deployment
  #     name: dinner-done-better-async-message-handler-deployment
  # - path: patches/deployment-pyroscope-env.yaml
  #   target:
  #     version: v1
  #     kind: Deployment
  #     name: dinner-done-better-admin-webapp-deployment
  # - path: patches/cronjob-pyroscope-env.yaml
  #   target:
  #     kind: CronJob
  #     name: dinner-done-better-job-db-cleaner
  # - path: patches/cronjob-pyroscope-env.yaml
  #   target:
  #     kind: CronJob
  #     name: dinner-done-better-job-email-deliverability-test
  # - path: patches/deployment-pyroscope-env.yaml
  #   target:
  #     version: v1
  #     kind: Deployment
  #     name: dinner-done-better-scheduler-deployment

  ### Async Message Handler - needs database, pubsub, service secrets, environment, workload identity
  - path: patches/deployment-workload-identity.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment
  - path: patches/deployment-database-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment
  - path: patches/deployment-database-password-async-message-handler.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment
  - path: patches/deployment-pubsub-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment
  - path: patches/deployment-service-secrets-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment
  - path: patches/deployment-push-notifications-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment
  - path: patches/deployment-apns-volume.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment
  - path: patches/deployment-disclosure-artifact-key-worker.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment
  - patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: DINNER_DONE_BETTER_SERVICE_ENVIRONMENT
          value: prod
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-async-message-handler-deployment

  ### CronJobs - workload identity (api-service-account) for GCP Pub/Sub, Secret Manager
  - path: patches/cronjob-secrets-csi-volume.yaml
    target:
      kind: CronJob

  ### Email Deliverability Test CronJob - needs Resend API key
  - path: patches/cronjob-resend-env.yaml
    target:
      kind: CronJob
      name: dinner-done-better-job-email-deliverability-test

  ### DB Cleaner CronJob - needs database only
  - path: patches/cronjob-database-env.yaml
    target:
      kind: CronJob
      name: dinner-done-better-job-db-cleaner
  - path: patches/cronjob-database-password-db-cleaner.yaml
    target:
      kind: CronJob
      name: dinner-done-better-job-db-cleaner

  ### Scheduler Deployment - needs database, pubsub, posthog, and (for the disclosure artifact
  ### reaper) workload identity to delete objects from the user data bucket.
  ### The union of what the six interval CronJobs it replaced each needed.
  - path: patches/deployment-workload-identity.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-scheduler-deployment
  - path: patches/deployment-database-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-scheduler-deployment
  - path: patches/deployment-database-password-scheduler.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-scheduler-deployment
  - path: patches/deployment-pubsub-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-scheduler-deployment
  - path: patches/deployment-posthog-env.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-scheduler-deployment
  - path: patches/deployment-disclosure-artifact-key-worker.yaml
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-scheduler-deployment

  ### MCP Server - OAuth credentials from mcp-server-config secret (API URLs are in config JSON)
  - patch: |-
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: DINNER_DONE_BETTER_API_SERVICE_OAUTH2_API_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mcp-server-config
              key: OAUTH2_CLIENT_ID
      - op: add
        path: "/spec/template/spec/containers/0/env/-"
        value:
          name: DINNER_DONE_BETTER_API_SERVICE_OAUTH2_API_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mcp-server-config
              key: OAUTH2_CLIENT_SECRET
    target:
      version: v1
      kind: Deployment
      name: dinner-done-better-mcp-server-deployment

labels:
  - pairs:
      app.kubernetes.io/name: dinner-done-better-backend
      deployed_by: skaffold

configMapGenerator:
  - name: dinner-done-better-service-api-config
    namespace: prod
    files:
      - config.json=./configs/api_service_config.json

  - name: dinner-done-better-async-message-handler-config
    namespace: prod
    files:
      - config.json=./configs/async_message_handler_config.json

  - name: dinner-done-better-job-db-cleaner-config
    namespace: prod
    files:
      - config.json=./configs/job_db_cleaner_config.json

  - name: dinner-done-better-job-email-deliverability-test-config
    namespace: prod
    files:
      - config.json=./configs/job_email_deliverability_test_config.json

  - name: dinner-done-better-scheduler-config
    namespace: dinner-done-better-prod
    files:
      - config.json=./configs/scheduler_config.json

  - name: dinner-done-better-mcp-server-config
    namespace: prod
    files:
      - config.json=./configs/mcp_server_config.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    generated_by: skaffold
    deployed_by: skaffold
  annotations:
    generated_by: skaffold
    deployed_by: skaffold
