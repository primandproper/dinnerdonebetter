---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: dinner-done-better-backend

# Every backend workload — API, MCP, scheduler, async message handler, and the CronJobs — is
# one binary selected by subcommand, so there is one artifact here rather than one per workload.
# Which workload a pod runs is its manifest's `args`. See cmd/ddb.
profiles:
  - name: localdev
    activation:
      - kubeContext: docker-desktop
    build:
      local:
        push: false
      tagPolicy:
        sha256: {}
      artifacts:
        - image: dinner-done-better-backend
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v10/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v10/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v10/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v10/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/ddb
            fromImage: golang:1.26-trixie

    manifests:
      kustomize:
        paths:
          - deploy/environments/localdev/kustomize
        # The localdev configMapGenerator reads ../config_files/ — the same generated JSON
        # docker-compose mounts — instead of a second rendered copy under kustomize/.
        buildArgs:
          - --load-restrictor
          - LoadRestrictionsNone

    deploy:
      kubeContext: docker-desktop
      kubectl:
        defaultNamespace: localdev
    portForward:
      - resourceType: Service
        resourceName: dinner-done-better-api-svc
        namespace: localdev
        port: 8000

  - name: prod
    build:
      tagPolicy:
        sha256: {}
      artifacts:
        - image: us-central1-docker.pkg.dev/dinner-done-better-prod/containers/dinner-done-better-backend
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v10/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v10/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v10/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v10/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/ddb
            fromImage: golang:1.26-trixie

    manifests:
      kustomize:
        paths:
          - deploy/environments/prod/kustomize

    deploy:
      kubectl:
        defaultNamespace: prod
