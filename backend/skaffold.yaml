---
apiVersion: skaffold/v4beta11
kind: Config

metadata:
  name: dinner-done-better-backend

profiles:
  - name: localdev
    activation:
      - kubeContext: docker-desktop
    build:
      local:
        push: false
      tagPolicy:
        sha256: {}
      artifacts:
        # backend artifacts (ko)
        - image: dinner-done-better-service-api
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/services/api
            fromImage: golang:1.26-trixie

        - image: dinner-done-better-job-db-cleaner
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/workers/db_cleaner
            fromImage: golang:1.26-trixie

        - image: dinner-done-better-job-email-deliverability-test
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/workers/email_deliverability_test
            fromImage: golang:1.26-trixie

        - image: dinner-done-better-scheduler
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/workers/scheduler
            fromImage: golang:1.26-trixie

        - image: dinner-done-better-mcp-server
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/services/mcp
            fromImage: golang:1.26-trixie

          # NOTE: no cmd/functions here

    manifests:
      kustomize:
        paths:
          - deploy/environments/localdev/kustomize

    deploy:
      kubeContext: docker-desktop
      kubectl:
        defaultNamespace: localdev
    portForward:
      - resourceType: Service
        resourceName: dinner-done-better-api-svc
        namespace: localdev
        port: 8000

  - name: prod
    build:
      tagPolicy:
        sha256: {}
      artifacts:
        - image: us-central1-docker.pkg.dev/dinner-done-better-prod/containers/dinner-done-better-service-api
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/services/api
            fromImage: golang:1.26-trixie

        - image: us-central1-docker.pkg.dev/dinner-done-better-prod/containers/dinner-done-better-job-db-cleaner
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/workers/db_cleaner
            fromImage: golang:1.26-trixie

        - image: us-central1-docker.pkg.dev/dinner-done-better-prod/containers/dinner-done-better-job-email-deliverability-test
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/workers/email_deliverability_test
            fromImage: golang:1.26-trixie

        - image: us-central1-docker.pkg.dev/dinner-done-better-prod/containers/dinner-done-better-scheduler
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/workers/scheduler
            fromImage: golang:1.26-trixie

        - image: us-central1-docker.pkg.dev/dinner-done-better-prod/containers/dinner-done-better-async-message-handler
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/functions/async_message_handler
            fromImage: golang:1.26-trixie

        - image: us-central1-docker.pkg.dev/dinner-done-better-prod/containers/dinner-done-better-mcp-server
          ko:
            dir: .
            flags:
              - -trimpath
            ldflags:
              - -s -w
              - -extldflags "-static"
              - -X github.com/primandproper/platform-go/v2/version.CommitHash={{ trim (cmd "bash" "-c" "git rev-parse HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.CommitTime={{ trim (cmd "bash" "-c" "git log -1 --format=%cI HEAD 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.BuildTime={{ trim (cmd "bash" "-c" "date -u -Iseconds 2>/dev/null || echo unknown") }}
              - -X github.com/primandproper/platform-go/v2/version.Version={{ default "dev" .VERSION }}
            main: ./cmd/services/mcp
            fromImage: golang:1.26-trixie

    manifests:
      kustomize:
        paths:
          - deploy/environments/prod/kustomize

    deploy:
      kubectl:
        defaultNamespace: prod
